<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREESTYLE IS THE VISION - LiveBitez Premiere</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f525.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  h1{font-size:42px;font-weight:900;letter-spacing:-2px;text-align:center;line-height:.9}
  h1 span{background:linear-gradient(90deg,#fff,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .tag{margin:16px 0 32px;border:1px solid #333;padding:8px 16px;border-radius:100px;font-size:12px;letter-spacing:2px;color:#888}
  .card{width:100%;max-width:400px;background:#111;border:1px solid #222;border-radius:24px;padding:24px}
  .btn{width:100%;background:#fff;color:#000;border:0;padding:18px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:1px;margin-top:12px}
  .btn:active{transform:scale(.98)}
  .status{font-size:12px;color:#555;text-align:center;margin-top:16px}
</style>
</head>
<body>
  <h1>FREESTYLE<br><span>IS THE VISION.</span></h1>
  <div class="tag">LIVEBITEZ PREMIERE • 53M ROUND</div>
  
  <div class="card">
    <p style="color:#888;font-size:14px;margin-bottom:12px">TODAY'S RITUAL</p>
    <p id="ritual" style="font-size:18px;line-height:1.4">Tap ignite to start your cinematic day. No laptop needed.</p>
    <button class="btn" onclick="ignite()">IGNITE 🔥</button>
    <div class="status" id="status">App ready • Offline capable</div>
  </div>

<script>
const rituals = [
  "Shoot 1 raw bite. No edit. Post it.",
  "Contact 1 person who can fund the vision.",
  "Lock in: 2 hours deep work. Phone on DND.",
  "The beginning. Let's start here.",
  "Freestyle is the vision. Structure is the vehicle."
];
function ignite(){
  document.getElementById('ritual').innerText = rituals[Math.floor(Math.random()*rituals.length)];
  if(navigator.vibrate) navigator.vibrate(50);
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
